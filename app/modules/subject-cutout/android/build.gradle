plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjectcutout'
version = '1.0.0'

android {
  namespace "expo.modules.subjectcutout"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // On-device subject segmentation through Google Play services (no model bundled in the app).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
